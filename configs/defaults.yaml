# Every tunable with its default. See IMPLEMENTATION_PLAN.md §15.
# Precedence: this file -> --config run.json -> CLI flags.

k: 10
target_recall: 0.95

hnsw:
  M: 16
  ef_construction: 500          # authors' setting
  seed: 100

adaef:
  quantile_step: 0.001
  statics_length: 0             # full probe: 0 => auto 1 + 2M + (2M-1)*2M  (=1025 for M=16)
  ef_upper_bound: 5000
  probe_lengths: [1025, 512, 256, 128]   # probe menu (plan §1A.4): one Ada-ef table per length, descending; largest = full

probe:
  enabled: true                 # false keeps only the full probe (v1 ef-only ablation, plan §1A.2)

gt:
  k_store: 100

calibration:
  n: 1000
  source: base_sample           # base_sample (authors' default) | query_holdout
  seed: 42
  ladder_ratio: 2.0
  min_group_size: 30
  max_groups: 8

engine:
  threads: null                 # REQUIRED via --threads C
  pin_cores: false

slo:
  ms: null                      # REQUIRED: T_SLO in ms, taken as given. Experiments set it per run (see configs/experiments/).

window:                         # Main Flow §3 / Budget B §3
  n: 500                        # completions per window = length of the p95 / S_p95 ring (last n completions)
  max_ms: 20                    # time trigger: also close after this long, but only with >= min_samples new completions
  min_samples: 50               # guard so p95 is never computed from a handful of samples

telemetry:
  alpha_u: 0.05
  alpha_es: 0.05
  alpha_lambda: 0.2
  lambda_tick_ms: 10

controller:
  type: p_aimd                  # p_aimd | fixed_aimd | static_capacity | none
  cut_floor: 0.5
  headroom: 0.85
  growth: 1.02
  guard: true
  fixed_cut: 0.9                # fixed_aimd only
  rho_target: 0.9               # static_capacity only

bucket:
  t_base: mean                  # mean => T_SLO - E[S]; tail => T_SLO - S_p95
  cap_pos: 0                    # total burst credit = D

allocator:
  type: water_filling           # water_filling | uniform_cut | passthrough
  uniform_mode: work            # work | ef

floor_mode:
  enabled: true                 # queries are NEVER dropped; false only for ablation

workload:
  profile: poisson              # arrival process: poisson (exponential gaps at rate qps) | constant (gap = 1/qps) | step | mmpp2 | trace
  qps: null                     # REQUIRED: arrival rate lambda in queries/s (absolute; experiments set it from rho x mu_sat(C))
  n_queries: 20000
  duration_s: null
  warmup_queries: 1000
  seed: 7
